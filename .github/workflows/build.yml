name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "=== Files in root ==="
          ls -la
          unzip -q *.zip -d project
          echo "=== After unzip ==="
          find project -maxdepth 3 -type d
          find project -name "gradlew" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          # gradlew যেখানে আছে সেখানে যাও
          GRADLEW_PATH=$(find project -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found anywhere!"
            find project -type f | head -50
            exit 1
          fi
          
          echo "Found gradlew at: $GRADLEW_PATH"
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project directory: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: warn
